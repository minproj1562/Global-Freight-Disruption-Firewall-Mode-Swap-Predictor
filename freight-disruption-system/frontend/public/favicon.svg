<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#082f49" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#0d9488" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber-Shield Hexagon -->
  <polygon points="32,4 58,16 58,40 32,58 6,40 6,16" 
           fill="url(#shieldGrad)" 
           stroke="url(#cyanGlow)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Concentric Radar Arcs -->
  <circle cx="32" cy="32" r="21" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="32" r="14" stroke="#06b6d4" stroke-width="1" opacity="0.6" />

  <!-- Tactical Crosshairs -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="44" x2="32" y2="52" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="32" x2="20" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="44" y1="32" x2="52" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Stylized Vessel Bow / Navigational Arrowhead -->
  <path d="M32 18 L43 38 L32 34 L21 38 Z" 
        fill="url(#cyanGlow)" 
        filter="url(#glow)" />

  <!-- Core Firewall Beacon Point -->
  <circle cx="32" cy="32" r="3.5" fill="url(#amberAccent)" />
  <circle cx="32" cy="32" r="6" stroke="#fbbf24" stroke-width="1" opacity="0.8" />
</svg>